<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><title>Fountain Coach Instruments: Sing, Ear, SatzfunkPlayer</title><rect width="1200" height="630" fill="#eceee7"/><text x="110" y="105" font-family="Arial,Helvetica,sans-serif" font-size="60" font-weight="600" fill="#283733" letter-spacing="-3">Instruments</text><path d="M110 130H1090" stroke="#a1aaa2" stroke-width="2"/><g transform="translate(110 172) scale(.85)"><title id="title-sing">Sing — voice and articulation</title><desc id="desc-sing">A vertical vocal source with three open resonating waves</desc><rect width="256" height="256" rx="48" fill="#eceee7"/><g fill="none" stroke="#283733" stroke-linecap="round" stroke-linejoin="round"><path d="M128 184V73" stroke-width="11"/><path d="M113 73a15 15 0 0 1 30 0" stroke-width="10"/><path d="M97 96c-21 15-21 49 0 64m62-64c21 15 21 49 0 64" stroke-width="8"/><path d="M71 77c-33 27-33 76 0 103m114-103c33 27 33 76 0 103" stroke-width="7"/><path d="M105 188h46" stroke-width="7"/></g><circle cx="128" cy="57" r="7" fill="#a07755"/></g><text x="110" y="437" font-family="Arial,Helvetica,sans-serif" font-size="29" letter-spacing="-1.3" font-weight="600" fill="#283733">Sing</text><text x="110" y="475" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#5b655e">Make voice</text><g transform="translate(481 172) scale(.85)"><title id="title-ear">Ear — attentive listening</title><desc id="desc-ear">Three arriving sound arcs converge at a listening point</desc><rect width="256" height="256" rx="48" fill="#eceee7"/><g fill="none" stroke="#283733" stroke-linecap="round"><path d="M72 69c-35 31-36 89-3 122" stroke-width="7"/><path d="M100 87c-24 23-25 58-1 82" stroke-width="8"/><path d="M132 106c-11 10-11 31 0 42" stroke-width="9"/><path d="M157 58c34 15 56 47 56 84 0 36-19 61-52 76" stroke-width="7"/><path d="M158 89c19 10 30 27 30 48 0 20-10 35-29 44" stroke-width="7"/></g><circle cx="150" cy="128" r="11" fill="#a07755"/></g><text x="4